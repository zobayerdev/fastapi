<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#0e7c66"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- decorative circuit-like lines -->
  <g stroke="#22d3ee" stroke-opacity="0.25" stroke-width="2" fill="none">
    <path d="M0 40 H180 L220 80 H420"/>
    <path d="M0 220 H150 L190 180 H360"/>
    <path d="M1200 60 H1020 L980 100 H820"/>
    <path d="M1200 200 H1050 L1010 160 H860"/>
  </g>
  <g fill="#34d399" fill-opacity="0.7">
    <circle cx="420" cy="80" r="4"/>
    <circle cx="360" cy="180" r="4"/>
    <circle cx="820" cy="100" r="4"/>
    <circle cx="860" cy="160" r="4"/>
  </g>

  <!-- lightning bolt (FastAPI motif) -->
  <g transform="translate(90,70)">
    <polygon points="70,0 20,70 55,70 40,120 100,45 62,45" fill="url(#accent)"/>
  </g>

  <text x="230" y="118" font-family="Verdana, Arial, sans-serif" font-size="54" font-weight="bold" fill="#ffffff">
    FastAPI Learning Journey
  </text>
  <text x="230" y="160" font-family="Verdana, Arial, sans-serif" font-size="24" fill="#a7f3d0">
    Python &#183; FastAPI &#183; Uvicorn &#183; Virtual Environment
  </text>

  <g font-family="Verdana, Arial, sans-serif" font-size="16" fill="#e2e8f0">
    <rect x="230" y="185" width="90" height="28" rx="6" fill="#0e7c66" fill-opacity="0.6"/>
    <text x="245" y="204">Python</text>

    <rect x="330" y="185" width="90" height="28" rx="6" fill="#0e7c66" fill-opacity="0.6"/>
    <text x="345" y="204">FastAPI</text>

    <rect x="430" y="185" width="90" height="28" rx="6" fill="#0e7c66" fill-opacity="0.6"/>
    <text x="445" y="204">Uvicorn</text>
  </g>
</svg>
